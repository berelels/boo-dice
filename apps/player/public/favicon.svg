<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d4aff"/>
      <stop offset="1" stop-color="#d64592"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>

  <!-- faísca cósmica: Boo é um hamster espacial -->
  <path d="M50 8 L51.3 10.7 L54 12 L51.3 13.3 L50 16 L48.7 13.3 L46 12 L48.7 10.7 Z" fill="#ffe9b0"/>
  <circle cx="9" cy="46" r="1.3" fill="#ffe9b0" opacity="0.9"/>

  <!-- o d20: o dado que o Boo carrega para todo lado -->
  <path d="M42 29 L52 34 L52 48 L42 53 L32 48 L32 34 Z" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M42 29 L42 41 M42 41 L32 34 M42 41 L52 34 M42 41 L37 50 M42 41 L47 50" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- Boo: orelhas atrás da cabeça -->
  <circle cx="14" cy="17" r="4.5" fill="#fff6e8"/>
  <circle cx="30" cy="16" r="4.5" fill="#fff6e8"/>

  <!-- bochechas fofas, a marca registrada de hamster -->
  <ellipse cx="10" cy="30" rx="7" ry="5.5" fill="#fff6e8"/>
  <ellipse cx="34" cy="30" rx="7" ry="5.5" fill="#fff6e8"/>

  <!-- cabeça -->
  <circle cx="22" cy="26" r="11" fill="#fff6e8"/>

  <!-- rosto -->
  <circle cx="18" cy="25" r="1.6" fill="#3a2360"/>
  <circle cx="26" cy="25" r="1.6" fill="#3a2360"/>
  <circle cx="22" cy="29" r="1.2" fill="#3a2360"/>
</svg>
