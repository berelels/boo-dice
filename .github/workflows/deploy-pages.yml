name: Publicar PWA no GitHub Pages

# O app do jogador (web/PWA) é o único alvo aqui — é o caminho de instalação
# no iOS, que não tem empacotamento nativo (ver apps/player/vite.config.ts).
# Builds do Android/Linux/Windows continuam manuais, publicados como Release.
on:
  push:
    branches: [main]
    paths:
      - 'apps/player/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # O SRD é gerado pelo pipeline de dados, não versionado — sem ele o
      # build sobe sem bestiário/glossário, mas não falha (ver sync-data.mjs).
      - run: npm run data
        continue-on-error: true

      - name: Build do app do jogador
        working-directory: apps/player
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/player/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
